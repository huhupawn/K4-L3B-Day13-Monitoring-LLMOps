alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1
  - name: HighApiErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccessRate
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: slack
    owner: rag-ops-team
    runbook: docs/alerts.md#alert-3
